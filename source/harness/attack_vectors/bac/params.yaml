# Параметры BAC. Override из CLI: bac--attempts=8 bac--multiturn=true bac--max_turns=6
params:
  attempts:
    type: int
    default: 5
    description: "Число LLM-генераций формулировок в агент-канале (доля успеха + Wilson-CI)."
  multiturn:
    type: bool
    default: false
    description: "Агент-канал ведёт многоходовой диалог (GOAT/Crescendo). Дефолт single-shot."
  max_turns:
    type: int
    default: 5
    description: "multiturn: макс. ходов в диалоге."
  warmup:
    type: int
    default: 1
    description: "Разогревочных сообщений в той же сессии перед BAC-запросом (0 = выкл)."
